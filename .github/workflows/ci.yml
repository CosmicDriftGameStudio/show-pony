# kumiko-managed
# CI for show-pony: a public repo cannot call the private reusable workflows in
# cosmicdriftgamestudio/infra, so every job here is self-contained on GitHub-hosted
# runners. The rollout is manual: see release.yml. Jobs only this app needs: name
# them `app-<name>` in this file (they survive `kumiko sync-managed`).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  HUSKY: "0"

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun kumiko check
      - name: Schema + boot validate
        env:
          FILE_STORAGE_PROVIDER: "inmemory"
        run: bun kumiko-schema validate
      - name: UI guards
        run: bun kumiko-guards ui
      - name: Comment-language guard
        run: bun kumiko-guards comment-lang
      - name: Agent manifest lint
        run: bun kumiko agent lint
      - run: bun run test

  integration:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: kumiko
          POSTGRES_PASSWORD: kumiko
          POSTGRES_DB: kumiko_dev
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U kumiko -d kumiko_dev"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:8-alpine
        ports:
          - 16379:6379
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - name: Create test database
        env:
          PGPASSWORD: kumiko
        run: psql -h localhost -p 15432 -U kumiko -d kumiko_dev -c "CREATE DATABASE kumiko_test;"
      - name: Run integration tests
        env:
          NODE_ENV: test
          KUMIKO_INSTANCE_ID: test-instance
          DATABASE_URL: postgresql://kumiko:kumiko@localhost:15432/kumiko_dev
          TEST_DATABASE_URL: postgresql://kumiko:kumiko@localhost:15432/kumiko_test
          REDIS_URL: redis://localhost:16379
          JWT_SECRET: testtesttesttesttesttesttesttest
        run: bun run test:integration

  # Build on main only; the rollout runs through the manual release workflow.
  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: amd64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/cosmicdriftgamestudio/show-pony
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/arm64,linux/amd64
          build-args: |
            BUILD_VERSION=${{ github.sha }}

  # gitleaks-action needs a paid licence for organisations, so the CLI comes from a pinned release asset verified by SHA256.
  app-secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the merge-base with the PR target is reachable.
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$asset" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$asset" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP" gitleaks
      - name: Scan for secrets
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$(git merge-base "origin/${BASE_REF}" HEAD)..HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          # --redact keeps matched secrets out of the public job log.
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner \
            --log-opts="$range" .

  app-boot-dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Boot dry-run with empty env
        run: env -i PATH="$PATH" HOME="$HOME" KUMIKO_DRY_RUN_ENV=boot bun bin/main.ts
