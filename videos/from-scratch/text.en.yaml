intro: "Mira runs rooftop events. She wants one link to share with her guests and a guest list that fills itself. Let's build that app from scratch with Kumiko."
scaffold: "One command creates the app. The installer scaffolds fourteen features, including sign-in, sessions, files and the tools for data requests. Install the packages, start Postgres and Redis with Docker, and bun dev prints the address and the login."
data-model: "Now the data. An event has a title, a slug for the invite link, a start time, a location and a guest limit. The form on the right comes straight from this definition: required fields get a star, the start time gets a date and a time picker, and the guest limit takes only numbers."
create-event: "Mira signs in and creates her first event: Rooftop Launch, with a slug for the link, a date, a place and room for eighty guests."
screens: "Screens are declarations. One line lists the columns of the event list, and the guest limit Mira just entered shows up in its own column."
theming: "The screens work, but they still wear the Kumiko default. The colors live in one theme file. A few tokens, each with a light and a dark value, turn the neutral look into Mira's violet, and every screen picks them up."
anonymous-rsvp: "Now the guest side. Guests don't sign up. The RSVP handler accepts anonymous calls and allows twenty replies per minute from one address. Which host a reply belongs to comes from the subdomain of the link, never from what the guest sends."
invite-branding: "Before she shares the link, Mira dresses up the invite page. On the Invite branding screen she picks an orange accent, a rooftop photo and the split layout, without touching any code."
guest-rsvp: "Mira shares the link. Her friend Ava opens it, fills in name and email, answers yes and brings one friend, without an account or a password."
guest-list: "Back in the dashboard, the reply is already in Mira's guest list, plus one included."
mail-calendar: "Because the guest left an email, Kumiko sends a confirmation mail. The invite page also offers an Add to calendar file, built right in the browser."
rate-limit: "What about that limit of twenty? A script sends twenty-one replies from the same address. Twenty go through and land in the guest list. The twenty-first gets a 429 and is turned away."
search: "With twenty new names, the list is getting long, and Mira needs to find one guest fast. The guest name is marked fuzzy. That one word puts a search box on the list that forgives typos: Mira types Kowalsky with a y and still finds Emma Kowalski."
personal-data: "Every one of these replies holds a real name and an email address, and that kind of data comes with rules. So name and email are marked as personal data. In the database they are stored encrypted, while Mira sees them in plain text. When Ava asks to be deleted, a data protection officer erases her key. Her reply stays in the count, but her name and email are gone for good."
plans: "Last, the business side. Plans set the limits. The free plan allows one event and fifty guests, and the billing page shows how much Mira has used. Once the list is full, the next guest gets a clear message instead of a broken page."
outro: "That's the whole app: a branded invite link, a guest list that fills itself, her own colors, mail, calendar, search, encrypted personal data and plans. Every step is in the tutorial on docs.kumiko.rocks, and the live demo runs at show-pony.kumiko.rocks."
